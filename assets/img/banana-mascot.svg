  <path d="M35 110 L 28 116 C 25 119, 28 123, 32 121 L 39 116" 
        fill="#713F12" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>

  <!-- Óculos Escuros Estilo BananaJobs / Convertio Pro -->
