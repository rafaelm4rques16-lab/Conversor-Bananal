  <path d="M60 62 L 76 62 C 78 68, 76 76, 68 76 C 60 76, 58 68, 60 62 Z" fill="#18181B" stroke="#18181B" stroke-width="2"/>
  <!-- Lente Direita -->
  <path d="M82 62 L 98 62 C 100 68, 98 76, 90 76 C 82 76, 80 68, 82 62 Z" fill="#18181B" stroke="#18181B" stroke-width="2"/>
  <!-- Ponte dos óculos -->
  <path d="M75 64 L 83 64" stroke="#18181B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Haste esquerda -->
  <path d="M60 64 L 52 63" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
  <!-- Brilho no óculos -->
  <path d="M63 65 L 68 72" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M85 65 L 90 72" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sorriso carismático -->
