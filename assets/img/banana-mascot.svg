  <!-- Bochecha corada -->
  <circle cx="62" cy="84" r="3.5" fill="#F87171" fill-opacity="0.6"/>
  <circle cx="94" cy="84" r="3.5" fill="#F87171" fill-opacity="0.6"/>

  <!-- Pintinhas de banana madura -->
  <circle cx="56" cy="98" r="2" fill="#713F12" fill-opacity="0.4"/>
  <circle cx="72" cy="106" r="2.2" fill="#713F12" fill-opacity="0.4"/>
  <circle cx="48" cy="80" r="1.5" fill="#713F12" fill-opacity="0.4"/>
